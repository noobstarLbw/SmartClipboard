name: Build & Release SmartClipboard

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate application icon
        run: |
          python generate_icon.py

      - name: Compile standalone executable
        run: |
          pyinstaller --clean `
            --name "SmartClipboard" `
            --onefile `
            --windowed `
            --icon "app_icon.ico" `
            --hidden-import "PIL.BmpImagePlugin" `
            --hidden-import "PIL.PngImagePlugin" `
            --hidden-import "pystray._win32" `
            main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartClipboard-windows-x64
          path: dist/SmartClipboard.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartClipboard.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
